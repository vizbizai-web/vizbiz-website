<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="iconTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" ry="28" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" ry="27.5"
        fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.15"/>

  <g transform="translate(64, 64)">
    <!-- Left chat-bubble bracket with tail -->
    <path d="M -32 -38 Q -54 -38 -54 -18 L -54 16 Q -54 34 -36 38 L -42 48 L -25 36"
          fill="none" stroke="url(#iconTeal)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right chat-bubble bracket -->
    <path d="M 32 -38 Q 54 -38 54 -18 L 54 18 Q 54 38 32 38"
          fill="none" stroke="url(#iconTeal)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- V mark, nudged left -->
    <path d="M -22 -16 L -4 18 L 14 -16"
          fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Citation dot -->
    <circle cx="26" cy="-16" r="4" fill="#22D3EE"/>
  </g>
</svg>
